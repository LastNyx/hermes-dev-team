# No-model tests on every push and PR, on Linux and Windows. No secrets: the repo is public, the token is read-only,
# and fork PRs get no secrets anyway. Actions are pinned by commit SHA (a tag can be moved).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GIT_TERMINAL_PROMPT: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: git identity and default branch for the tests' throwaway repos
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - name: show the temp path (Windows runners use an 8.3 short name)
        run: python -c "import tempfile, pathlib; t = tempfile.gettempdir(); print(t, '->', pathlib.Path(t).resolve())"
      - name: delegate_runs
        run: python tests/delegate_runs.py
      - name: parallel_dispatch
        run: python tests/parallel_dispatch.py
      - name: kit_shared
        run: python tests/kit_shared.py
      - name: planner_log
        run: python tests/planner_log.py
      - name: git_guard
        run: python tests/git_guard.py
      - name: push_guard
        run: python tests/push_guard.py
      - name: resume_e2e
        run: python tests/resume_e2e.py
      - name: resume_workspace
        run: python tests/resume_workspace.py
      - name: shared_repo
        run: python tests/shared_repo.py
      - name: researcher
        run: python tests/researcher.py
      - name: existing_project
        run: python tests/existing_project.py
      - name: suite_runner
        run: python tests/suite_runner.py
      - name: check_run
        run: python tests/check_run.py
